<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign in | Product Portal</title>

    <link rel="stylesheet"
          href="/css/auth.css"
          th:href="@{/css/auth.css}">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-title">

            <div class="brand">Product Portal</div>

            <h1 id="login-title">Welcome back</h1>

            <p class="intro">
                Sign in to your account to explore our products.
            </p>

            <!-- Chỉ xuất hiện khi đăng nhập gặp lỗi. -->
            <div class="notice notice-error"
                 role="alert"
                 th:if="${param.error != null}">
                We couldn't sign you in.
                Please try again with your Google account.
            </div>

            <!-- Chỉ xuất hiện sau khi đăng xuất. -->
            <div class="notice notice-success"
                 role="status"
                 th:if="${param.logout != null}">
                You have been logged out successfully.
            </div>


            <!-- Giao diện demo: chưa gửi thông tin đến server. -->
            <div class="local-login-demo"
                 role="group"
                 aria-label="Account sign-in"
                 aria-describedby="local-login-note">

                <div class="local-login-field">
                    <label for="username">Username</label>

                    <input id="username"
                           name="username"
                           type="text"
                           placeholder="Enter your username"
                           autocomplete="username"
                           autocapitalize="none"
                           spellcheck="false">
                </div>

                <div class="local-login-field">
                    <label for="password">Password</label>

                    <div class="password-input-wrap">
                        <input id="password"
                            name="password"
                            type="password"
                            placeholder="Enter your password"
                            autocomplete="current-password">

                        <button id="password-toggle"
                                class="password-toggle"
                                type="button"
                                aria-label="Show password"
                                aria-controls="password"
                                title="Show password">

                            <!-- Mắt nhắm: mật khẩu đang được che. -->
                            <svg class="eye-closed"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M3 9c2.5 3.3 5.5 5 9 5s6.5-1.7 9-5"/>
                                <path d="m3 15 2.2-3M7 18l1-4M12 19v-5M17 18l-1-4M21 15l-2.2-3"/>
                            </svg>

                            <!-- Mắt mở: mật khẩu đang hiển thị. -->
                            <svg class="eye-open is-hidden"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="actions">
                    <button class="button button-primary"
                            type="button"
                            disabled>
                        Sign in
                    </button>

                    <button class="button button-secondary"
                            type="button"
                            disabled>
                        Register
                    </button>
                </div>

            </div>

            <div class="login-divider" aria-hidden="true">
                <span>or</span>
            </div>


            <a class="button google-button"
               href="/oauth2/authorization/google"
               th:href="@{/oauth2/authorization/google}">

                <svg class="google-icon"
                     viewBox="0 0 48 48"
                     aria-hidden="true">

                    <path fill="#EA4335"
                          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z"/>

                    <path fill="#4285F4"
                          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.03 46.98 31.88 46.98 24.55Z"/>

                    <path fill="#FBBC05"
                          d="M10.53 28.59A14.41 14.41 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19Z"/>

                    <path fill="#34A853"
                          d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z"/>
                </svg>

                <span>Continue with Google</span>
            </a>

        </section>
    </main>

    <script>
        (() => {
            const passwordInput = document.getElementById("password");
            const toggleButton = document.getElementById("password-toggle");
            const eyeClosed = toggleButton.querySelector(".eye-closed");
            const eyeOpen = toggleButton.querySelector(".eye-open");

            toggleButton.addEventListener("click", () => {
                const showPassword = passwordInput.type === "password";

                passwordInput.type = showPassword ? "text" : "password";

                eyeClosed.classList.toggle("is-hidden", showPassword);
                eyeOpen.classList.toggle("is-hidden", !showPassword);

                const label = showPassword
                    ? "Hide password"
                    : "Show password";

                toggleButton.setAttribute("aria-label", label);
                toggleButton.title = label;
            });
        })();
    </script> 

    <script>
        (() => {
            const url = new URL(window.location.href);

            if (url.searchParams.has("logout")) {
                // Xóa tham số logout khỏi URL.
                url.searchParams.delete("logout");

                // Cập nhật thanh địa chỉ mà không tải lại trang.
                window.history.replaceState(
                    window.history.state,
                    "",
                    url.toString()
                );
            }
        })();
    </script>
</body>

</html>
