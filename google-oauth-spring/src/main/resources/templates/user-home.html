<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My account | Product Portal</title>

    <link rel="stylesheet"
          href="/css/auth.css"
          th:href="@{/css/auth.css}">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="account-title">

            <div class="brand">Product Portal</div>

            <span class="status-badge">Signed in</span>

            <h1 id="account-title">Welcome!</h1>

            <p class="intro">
                You're signed in and ready to explore.
            </p>

            <!-- Chỉ hiển thị tên và email, không có avatar. -->
            <dl class="account-details">

                <div>
                    <dt>Full name</dt>
                    <dd th:text="${name}">Your name</dd>
                </div>

                <div>
                    <dt>Email address</dt>
                    <dd th:text="${email}">Your email address</dd>
                </div>

            </dl>

            <div class="actions">

                <a class="button button-primary"
                   href="/products"
                   th:href="@{/products}">
                    View Products
                </a>

                <a class="button button-secondary"
                   href="/logout"
                   th:href="@{/logout}">
                    Logout
                </a>

            </div>

        </section>
    </main>
</body>

</html>
