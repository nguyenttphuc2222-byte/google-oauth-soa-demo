<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background-color: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product h2 {
            margin-top: 0;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 30px auto;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border-radius: 5px;
        }

        .back:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <h1>Product List</h1>

    <div class="products">

        <div class="product" th:each="product : ${products}">

            <h2 th:text="${product.name}"></h2>

            <p>
                ID:
                <span th:text="${product.id}"></span>
            </p>

            <p class="price">
                Price:
                <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}"></span>
                VND
            </p>

        </div>

    </div>

    <a class="back" href="/home">Back to Home</a>

</body>

</html>
