spring.application.name=seminar-oauth-hub
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=90m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_MB:15}MB
spring.servlet.multipart.max-request-size=55MB
spring.mvc.static-path-pattern=/static/**
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/seminar;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
app.client-id=${GOOGLE_CLIENT_ID:configure-client-id}
app.client-secret=${GOOGLE_CLIENT_SECRET:configure-client-secret}
app.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.api-key=${GOOGLE_API_KEY:}
app.project-number=${GOOGLE_PROJECT_NUMBER:}
app.folder-id=${DRIVE_FOLDER_ID:}
app.student-emails=${STUDENT_EMAILS:}
app.auto-student-login=${AUTO_STUDENT_LOGIN:true}
app.auto-domain-roles=${AUTO_DOMAIN_ROLES:true}
app.lecturer-override-email=${LECTURER_OVERRIDE_EMAIL:524h0133@student.tdtu.edu.vn}
app.lecturer-emails=${LECTURER_EMAILS:}
app.allowed-workspace-domains=${ALLOWED_WORKSPACE_DOMAINS:student.tdtu.edu.vn,tdtu.edu.vn}
app.max-upload-mb=${MAX_UPLOAD_MB:15}
app.display-timezone=${DISPLAY_TIMEZONE:Asia/Ho_Chi_Minh}
app.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
app.google.token-uri=https://oauth2.googleapis.com/token
app.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
app.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
app.google.issuer-uri=https://accounts.google.com
app.google.revoke-uri=https://oauth2.googleapis.com/revoke
app.google.drive-base=https://www.googleapis.com/drive/v3
app.google.upload-base=https://www.googleapis.com/upload/drive/v3
app.google.gmail-base=https://gmail.googleapis.com/gmail/v1
drive-access.mode=${DRIVE_ACCESS_MODE:MANUAL}
drive-access.owner-email=${DRIVE_ADMIN_EMAIL:523h0080@student.tdtu.edu.vn}
drive-access.token-key=${DRIVE_ADMIN_TOKEN_KEY:}
